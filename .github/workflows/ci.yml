name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows-msvc:
    name: Windows / MSVC / tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Tests
        run: |
          build/windows-msvc/Release/macrame_playground.exe --tests
          $code = $LASTEXITCODE
          Write-Host "macrame exit code: $code (0x$('{0:X8}' -f $code))"
          if ($code -ne 0) { exit $code }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-crash
          path: |
            build/windows-msvc/Release/macrame_playground.exe
            build/windows-msvc/Release/macrame_playground.pdb
            macrame_crash.dmp
          if-no-files-found: ignore

  # Debug is a genuinely different binary: MSVC's debug CRT compiles in _ITERATOR_DEBUG_LEVEL=2
  # (checked iterators, hardened container asserts) that Release and shipping do not. A compile-DOT
  # use-after-free was benign UB in Release (a retained buffer) but tripped the debug iterator
  # assert -- and no CI ran Debug, so it shipped. This job runs the suite under those checks.
  windows-msvc-debug:
    name: Windows / MSVC / Debug (iterator debugging)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build (Debug)
        run: cmake --build --preset windows-msvc-debug
      - name: Tests
        run: |
          build/windows-msvc/Debug/macrame_playground.exe --tests
          $code = $LASTEXITCODE
          Write-Host "macrame exit code: $code (0x$('{0:X8}' -f $code))"
          if ($code -ne 0) { exit $code }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-debug-crash
          path: |
            build/windows-msvc/Debug/macrame_playground.exe
            build/windows-msvc/Debug/macrame_playground.pdb
            macrame_crash.dmp
          if-no-files-found: ignore

  windows-clang-cl:
    name: Windows / clang-cl / tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-clang-cl
      - name: Build
        run: cmake --build --preset windows-clang-cl
      - name: Tests
        run: |
          build/windows-clang-cl/Release/macrame_playground.exe --tests
          $code = $LASTEXITCODE
          Write-Host "macrame exit code: $code (0x$('{0:X8}' -f $code))"
          if ($code -ne 0) { exit $code }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-cl-crash
          path: |
            build/windows-clang-cl/Release/macrame_playground.exe
            build/windows-clang-cl/Release/macrame_playground.pdb
            macrame_crash.dmp
          if-no-files-found: ignore

  # The shipping shape (harness + profiling compiled out) is a genuinely different binary:
  # different class layouts, different rule set, whole test groups not applicable. It went
  # unrun long enough to accumulate six failures and a crash, which is the argument for a
  # job rather than a documented "remember to check this".
  windows-shipping:
    name: Windows / clang-cl / shipping (no harness, no profiling)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-shipping
      - name: Build
        run: cmake --build --preset windows-shipping
      - name: Tests
        run: |
          build/windows-shipping/Release/macrame_playground.exe --tests
          $code = $LASTEXITCODE
          Write-Host "macrame exit code: $code (0x$('{0:X8}' -f $code))"
          if ($code -ne 0) { exit $code }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-crash
          path: |
            build/windows-shipping/Release/macrame_playground.exe
            build/windows-shipping/Release/macrame_playground.pdb
            macrame_crash.dmp
          if-no-files-found: ignore

  # Prove the library is consumable from outside the tree: install it, then a standalone
  # project (tests/consumer) pulls it in via find_package(macrame) and links macrame::macrame.
  # Catches a broken public include-interface or export set here, not at a downstream user.
  # The consumer project carries no copy of the library's build setup, so what it compiles
  # with is whatever the package actually exports.
  windows-consumer:
    name: Windows / MSVC / consumer (find_package)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + install the library
        run: |
          cmake --preset windows-msvc
          cmake --build --preset windows-msvc --target macrame
          cmake --install build/windows-msvc --prefix ${{ github.workspace }}/_install --config Release
      - name: Consumer find_package + build + run
        run: |
          cmake -S tests/consumer -B _consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/_install"
          cmake --build _consumer --config Release
          & "_consumer/Release/macrame_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The exceptions-off package is where usage requirements have to carry something: the
      # consumer's TUs must get _HAS_EXCEPTIONS=0 from the package alone, or the STL
      # declarations diverge and the access.h tripwire fails the link.
      - name: Build + install the library (MACRAME_NO_EXCEPTIONS)
        run: |
          cmake -S . -B _noexc -A x64 -DMACRAME_NO_EXCEPTIONS=ON -DMACRAME_BUILD_DRIVER=OFF
          cmake --build _noexc --config Release --target macrame
          cmake --install _noexc --prefix ${{ github.workspace }}/_install_noexc --config Release
      - name: Consumer find_package + build + run (against the exceptions-off package)
        run: |
          cmake -S tests/consumer -B _consumer_noexc "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/_install_noexc"
          cmake --build _consumer_noexc --config Release
          & "_consumer_noexc/Release/macrame_consumer.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The plain (non-sanitized) Linux build. It is not redundant with linux-tsan: TSan lowers every
  # atomic to a __tsan_atomic call, so that job cannot see whether the 16-byte deque cells
  # actually link - a missing double-word CAS stayed invisible until this job existed.
  linux-clang:
    name: Linux / clang-21 / build + stress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
      - name: Configure + build
        run: |
          cmake --preset linux-clang -DCMAKE_CXX_COMPILER=clang++-21
          cmake --build --preset linux-clang
      - name: Stress
        run: build/linux-clang/ts_tsan

  linux-tsan:
    name: Linux / clang-21 / ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tsan/run.sh is the canonical TSan path (its own timeout + TSAN_OPTIONS + exit handling);
      # it needs a recent clang (the C++23 sources are verified with clang 21). Install it from
      # apt.llvm.org -- the distro's default clang is older.
      - name: Install clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
      - name: TSan stress (tsan/run.sh)
        run: CXX=clang++-21 bash tsan/run.sh

  # The Linux twin of windows-consumer: install the package, then the standalone consumer
  # builds against it via find_package and runs. This is the job that catches Linux-only
  # packaging defects - a sanitizer flag leaking through the export, a missing
  # Threads::Threads usage requirement, tools/ headers the install forgot - which the
  # Windows consumer job structurally cannot see.
  linux-consumer:
    name: Linux / clang-21 / consumer (find_package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
      - name: Build + install the library
        run: |
          cmake --preset linux-clang -DCMAKE_CXX_COMPILER=clang++-21 -DMACRAME_BUILD_DRIVER=OFF
          cmake --build --preset linux-clang --target macrame
          cmake --install build/linux-clang --prefix ${{ github.workspace }}/_install
      - name: Consumer find_package + build + run
        run: |
          cmake -S tests/consumer -B _consumer -DCMAKE_CXX_COMPILER=clang++-21 "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/_install"
          cmake --build _consumer
          ./_consumer/macrame_consumer

  # GCC coverage: build the library and the whole driver with g++, run the suite. GCC 14
  # ships C++23 coroutines and <stacktrace> (via stdc++exp, probed by CMake); an external
  # reviewer's GCC 13 build passing is what promoted this from roadmap to CI.
  linux-gcc:
    name: Linux / GCC-14 / tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build
        run: |
          cmake --preset linux-gcc -DCMAKE_CXX_COMPILER=g++-14
          cmake --build --preset linux-gcc -j 4
      - name: Tests
        run: ./build/linux-gcc/ts_tsan --tests
