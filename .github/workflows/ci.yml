name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows-msvc:
    name: Windows / MSVC / tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc
      - name: Tests
        run: |
          build/windows-msvc/Release/task_system.exe --tests
          $code = $LASTEXITCODE
          Write-Host "task_system exit code: $code (0x$('{0:X8}' -f $code))"
          if ($code -ne 0) { exit $code }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-crash
          path: |
            build/windows-msvc/Release/task_system.exe
            build/windows-msvc/Release/task_system.pdb
            task_system_crash.dmp
          if-no-files-found: ignore

  windows-clang-cl:
    name: Windows / clang-cl / tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-clang-cl
      - name: Build
        run: cmake --build --preset windows-clang-cl
      - name: Tests
        run: |
          build/windows-clang-cl/Release/task_system.exe --tests
          $code = $LASTEXITCODE
          Write-Host "task_system exit code: $code (0x$('{0:X8}' -f $code))"
          if ($code -ne 0) { exit $code }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-cl-crash
          path: |
            build/windows-clang-cl/Release/task_system.exe
            build/windows-clang-cl/Release/task_system.pdb
            task_system_crash.dmp
          if-no-files-found: ignore

  linux-tsan:
    name: Linux / clang-21 / ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tsan/run.sh is the canonical TSan path (its own timeout + TSAN_OPTIONS + exit handling);
      # it needs a recent clang (the C++23 sources are verified with clang 21). Install it from
      # apt.llvm.org -- the distro's default clang is older.
      - name: Install clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
      - name: TSan stress (tsan/run.sh)
        run: CXX=clang++-21 bash tsan/run.sh
